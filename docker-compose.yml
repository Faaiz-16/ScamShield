# Runs ScamShield on a single server: MySQL, the API and the Telegram bot.
#
#   docker compose up -d --build     start (or update) everything
#   docker compose ps                status
#   docker compose logs -f bot       follow the bot's log
#
# Reads secrets from .env in this folder. On top of the usual settings it needs
# MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD (letters and digits only, since the
# password is placed inside DATABASE_URL). Sized to fit a 1 GB server with swap.

name: scamshield

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      # Keep memory use low on a small server.
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=30
    environment:
      MYSQL_DATABASE: scamshield
      MYSQL_USER: scamshield
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP only: the temporary server MySQL runs during first-time setup listens
      # on a socket, so this stays unhealthy until the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    logging: *logging

  api:
    build: .
    image: scamshield:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://scamshield:${MYSQL_PASSWORD}@db:3306/scamshield?charset=utf8mb4
      DATABASE_AUTO_CREATE: "false"
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Reachable only from the server itself (or through an SSH tunnel), not the internet.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, sys, urllib.request;
          body = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5));
          sys.exit(body['database'] != 'ok')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging

  bot:
    build: .
    image: scamshield:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      API_BASE_URL: http://api:8000
    command: ["python", "-m", "bot.main"]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  mysql-data:
