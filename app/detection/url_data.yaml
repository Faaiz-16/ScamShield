  - cf
  - tk
  - ga
  - cam
  - sbs
  - monster
  - quest
  - online
  - site
  - win
  - bid
  - date
  - racing
  - review
  - stream
  - download
  - zip
  - mov
  - kim
  - men
  - party
  - trade
  - cricket
  - science
  - accountant
  - cfd
  - lol
  - pw
  - vip

# Shared hosting platforms whose names contain brand keywords. Links on them
# are not official, but the brand name alone is not evidence of impersonation.
brand_check_exempt:
  - amazonaws.com
  - googleapis.com
  - googleusercontent.com

# Legitimate Indian banks, payment apps, government services and large brands.
# `domains` are official registered domains. `keywords` are brand names to
# look for inside unofficial domains; keywords shorter than 5 characters only
# match as a whole token (e.g. "sbi-kyc.com" but not "sbirds.com").
