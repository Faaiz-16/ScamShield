[project]
name = "scamshield"
version = "0.1.0"
description = "Multilingual scam message detector for SMS, WhatsApp and UPI messages in India"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test data includes full sample messages that are clearer kept on one line.
"tests/*" = ["E501"]
# User-facing English and Hindi sentences are easier to review unsplit.
"app/detection/verdict.py" = ["E501"]
"app/detection/url_analyzer.py" = ["E501"]
# Notebook cells are run top to bottom in Colab, with imports where they are needed.
"*.ipynb" = ["E402", "I001"]
