# Reference data for the URL analyzer. Edit this file to maintain the lists;
# no code changes are needed.

# Domain suffixes whose registration is restricted to verified owners.
# Any host under these is treated as official.
trusted_suffixes:
  - gov.in
  - nic.in
  - bank.in   # RBI-mandated domain for Indian banks
  - fin.in    # RBI-mandated domain for non-bank financial entities
  - sbi       # brand TLD owned by State Bank of India

# Suffixes missing from tldextract's bundled public suffix snapshot.
extra_public_suffixes:
  - bank.in
  - fin.in

url_shorteners:
  - bit.ly
  - bitly.com
  - bit.do
  - tinyurl.com
  - t.co
  - goo.gl
  - ow.ly
  - is.gd
  - v.gd
  - buff.ly
  - cutt.ly
  - rb.gy
  - shorturl.at
  - tiny.cc
  - rebrand.ly
  - t.ly
  - s.id
  - bl.ink
  - short.io
  - shorte.st
  - surl.li
  - urlz.fr
  - qrco.de
  - amzn.to
  - fkrt.it

# Domain endings heavily abused for phishing because they are cheap or free.
suspicious_tlds:
  - xyz
  - top
  - click
  - link
  - work
  - loan
  - live
  - buzz
  - icu
  - cyou
  - rest
  - fit
  - gq
